<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>splat-tour loading spike</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="viewer-canvas"></canvas>

    <div id="panel">
      <button id="panel-toggle-btn" type="button">パネルを閉じる</button>
      <div id="panel-body">
        <label>
          データ
          <select id="variant-select"></select>
        </label>
        <label class="inline">
          <input id="paged-check" type="checkbox" />
          ストリーミング（paged）
        </label>
        <label class="inline">
          <input id="lod-check" type="checkbox" />
          読み込み時にLoD生成（lod: true）
        </label>
        <button id="load-btn" type="button">読み込み</button>

        <label>
          解像度（pixel ratio）
          <select id="pixel-ratio-select">
            <option value="1">1</option>
            <option value="1.5">1.5</option>
            <option value="2">2</option>
            <option value="native" selected>端末の値</option>
          </select>
        </label>
        <label>
          LoD詳細度（lodSplatScale）<span id="lod-scale-value">1.00</span>
          <input id="lod-scale-range" type="range" min="0.1" max="2.5" step="0.05" value="1" />
        </label>
        <label>
          移動速度 <span id="move-speed-value">1.00</span>
          <input id="move-speed-range" type="range" min="0.1" max="5" step="0.1" value="1" />
        </label>
        <div class="row">
          <button id="flip-btn" type="button">上下反転</button>
          <button id="center-btn" type="button">中心へ移動</button>
        </div>

        <dl id="metrics"></dl>

        <div class="row">
          <button id="record-btn" type="button">計測値を記録</button>
          <button id="copy-btn" type="button">結果をコピー</button>
        </div>
        <textarea id="results" readonly rows="6" placeholder="「計測値を記録」を押すとここにJSONが溜まります"></textarea>
      </div>
    </div>

    <div id="joystick-zone"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
