<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>splat-tour</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="viewer-canvas"></canvas>
    <canvas id="scene-transition" hidden></canvas>

    <header id="tour-header">
      <button id="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="false" title="目次">☰</button>
      <h1 id="tour-title"></h1>
      <span id="scene-title"></span>
    </header>

    <div id="sidebar-backdrop" hidden></div>
    <nav id="sidebar" aria-label="目次" inert>
      <div id="sidebar-head">
        <span id="sidebar-title"></span>
        <button id="sidebar-close" type="button" title="閉じる">×</button>
      </div>
      <ul id="sidebar-list"></ul>
    </nav>

    <div id="loading" hidden>
      <div class="spinner"></div>
      <span>読み込み中…</span>
    </div>
    <div id="error" role="alert" hidden></div>
    <!-- Bottom right: "初期位置" and the settings (gear), which opens the switches (settings-panel.ts). -->
    <div id="hud">
      <div id="settings-panel" hidden>
        <div id="move-mode" class="settings-row" role="group" aria-label="移動のしかた" hidden>
          <span class="settings-icon"><svg class="icon icon-walk" viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4" r="2"/><path d="M10 21l2-6 3 3v3M8 12l3-4 4 3 3 1M11 8l-1 6"/></svg><svg class="icon icon-fly" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="10" width="6" height="4" rx="1"/><path d="M9 11L5 7M15 11l4-4M9 13l-4 4M15 13l4 4"/><circle cx="5" cy="7" r="2.2"/><circle cx="19" cy="7" r="2.2"/><circle cx="5" cy="17" r="2.2"/><circle cx="19" cy="17" r="2.2"/></svg></span>
          <button type="button" data-mode="walk" aria-pressed="false" title="床の上を歩く（壁は通り抜けない）">歩く</button>
          <button type="button" data-mode="fly" aria-pressed="false" title="自由に飛んで移動する">飛ぶ</button>
        </div>
        <div id="eye-level" class="settings-row" role="group" aria-label="目の高さ" hidden>
          <span class="settings-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4" r="2"/><path d="M12 7v8M8 10h8M12 15l-3 6M12 15l3 6"/></svg></span>
          <button type="button" data-level="adult" aria-pressed="true" title="大人の目の高さで歩く">大人</button>
          <button type="button" data-level="child" aria-pressed="false" title="子供の目の高さで歩く">子供</button>
        </div>
        <div id="click-move" class="settings-row" role="group" aria-label="クリックで移動" hidden>
          <span class="settings-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="17" rx="7" ry="3"/><path d="M12 3v10M9 10l3 3 3-3"/></svg></span>
          <button type="button" data-on="true" aria-pressed="true">ON</button>
          <button type="button" data-on="false" aria-pressed="false">OFF</button>
        </div>
      </div>
      <div class="hud-buttons">
        <button id="reset-view-btn" class="hud-round" type="button" title="初期位置（このシーンの最初の位置に戻る）" aria-label="初期位置"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7M6 10v10h12V10M10 20v-5h4v5"/></svg></button>
        <button id="settings-btn" class="hud-round" type="button" title="設定" aria-label="設定" aria-controls="settings-panel" aria-expanded="false" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
      </div>
    </div>
    <button id="jump-btn" type="button" title="ジャンプ（Space キー）" hidden>ジャンプ</button>

    <div id="tooltip" hidden>
      <h2 id="tooltip-title"></h2>
      <p id="tooltip-description"></p>
      <figure id="tooltip-thumbnail" hidden>
        <img id="tooltip-thumbnail-image" alt="" referrerpolicy="no-referrer" />
        <figcaption>移動先: <span id="tooltip-thumbnail-label"></span></figcaption>
      </figure>
      <button id="tooltip-open-btn" type="button">開く</button>
    </div>

    <div id="web-screen" hidden>
      <iframe
        id="web-frame"
        title="Web"
        referrerpolicy="no-referrer"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
      ></iframe>
    </div>

    <div id="screen-bar" hidden>
      <button id="back-btn" type="button">戻る</button>
      <span id="screen-title"></span>
      <a id="open-external-link" target="_blank" rel="noopener" hidden>新しいタブで開く</a>
    </div>

    <div id="joystick-zone"></div>
    <div id="look-zone"></div>

    <div id="debug-panel" hidden>
      <div id="debug-warnings" hidden></div>
      <div id="debug-stats"></div>
      <label>
        現在の視点（initialView / arrival 用）
        <textarea id="debug-view" rows="2" readonly></textarea>
      </label>
      <label>
        クリックした位置（入口の position 用）
        <textarea id="debug-point" rows="1" readonly></textarea>
      </label>
      <button id="debug-align-btn" type="button">床合わせ（床を3点クリック）</button>
      <button id="debug-capture-btn" type="button" title="入口のサムネイル（thumbnail / autoThumbnail）用。アイコンは写りません">今の画面を画像で保存</button>
      <span id="debug-align-status"></span>
      <textarea id="debug-transform" rows="2" readonly hidden></textarea>
      <details id="debug-collision">
        <summary>当たり判定メッシュを重ねる（.collision.glb）</summary>
        <input id="debug-collision-file" type="file" accept=".glb" />
        <div id="debug-collision-options">
          <label>
            軸の補正
            <select id="debug-collision-axis">
              <option value="">なし</option>
              <option value="x">X 軸 180°</option>
              <option value="y">Y 軸 180°</option>
              <option value="z">Z 軸 180°</option>
            </select>
          </label>
          <label class="debug-check"><input id="debug-collision-wire" type="checkbox" /> ワイヤーフレーム</label>
          <label class="debug-check"><input id="debug-collision-visible" type="checkbox" checked /> 表示</label>
        </div>
        <span id="debug-collision-info"></span>
      </details>
      <details id="debug-walk">
        <summary>歩いてみる（.voxel.json と .voxel.bin）</summary>
        <input id="debug-walk-files" type="file" accept=".json,.bin" multiple />
        <div id="debug-walk-options">
          <label class="debug-check"><input id="debug-walk-on" type="checkbox" /> 歩く</label>
          <label class="debug-check"><input id="debug-walk-voxels" type="checkbox" /> 近くのボクセルを表示</label>
          <label>表示の範囲
            <select id="debug-walk-voxel-range">
              <option value="3">半径 3 m</option>
              <option value="10" selected>半径 10 m</option>
              <option value="30">半径 30 m</option>
            </select>
          </label>
          <label class="debug-check"><input id="debug-walk-voxel-merge" type="checkbox" /> 遠くの箱をまとめる（軽い）</label>
          <label>濃さ
            <select id="debug-walk-voxel-opacity">
              <option value="0.25">薄い</option>
              <option value="0.45" selected>ふつう</option>
              <option value="0.7">濃い</option>
            </select>
          </label>
          <label>目の高さ <input id="debug-walk-eye" type="number" step="0.1" min="0.1" value="1.6" /></label>
          <label>体の半径 <input id="debug-walk-radius" type="number" step="0.05" min="0" value="0.2" /></label>
          <label>段差 <input id="debug-walk-step" type="number" step="0.05" min="0" value="0.35" /></label>
          <label class="debug-check" title="周りに固体のない小さなかけら（浮遊ノイズなど）では止まらない"><input id="debug-walk-specks" type="checkbox" checked /> 小さなかけらは無視</label>
        </div>
        <span id="debug-walk-info"></span>
      </details>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
