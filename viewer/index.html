<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>splat-tour</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="viewer-canvas"></canvas>

    <header id="tour-header">
      <button id="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="false" title="目次">☰</button>
      <h1 id="tour-title"></h1>
      <span id="scene-title"></span>
    </header>

    <div id="sidebar-backdrop" hidden></div>
    <nav id="sidebar" aria-label="目次" inert>
      <div id="sidebar-head">
        <span id="sidebar-title"></span>
        <button id="sidebar-close" type="button" title="閉じる">×</button>
      </div>
      <ul id="sidebar-list"></ul>
    </nav>

    <div id="loading" hidden>
      <div class="spinner"></div>
      <span>読み込み中…</span>
    </div>
    <div id="error" role="alert" hidden></div>
    <button id="reset-view-btn" type="button" title="このシーンの最初の位置に戻る">⟲ 初期位置</button>

    <div id="tooltip" hidden>
      <h2 id="tooltip-title"></h2>
      <p id="tooltip-description"></p>
      <figure id="tooltip-thumbnail" hidden>
        <img id="tooltip-thumbnail-image" alt="" referrerpolicy="no-referrer" />
        <figcaption>移動先: <span id="tooltip-thumbnail-label"></span></figcaption>
      </figure>
      <button id="tooltip-open-btn" type="button">開く</button>
    </div>

    <div id="web-screen" hidden>
      <iframe
        id="web-frame"
        title="Web"
        referrerpolicy="no-referrer"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
      ></iframe>
    </div>

    <div id="screen-bar" hidden>
      <button id="back-btn" type="button">戻る</button>
      <span id="screen-title"></span>
      <a id="open-external-link" target="_blank" rel="noopener" hidden>新しいタブで開く</a>
    </div>

    <div id="joystick-zone"></div>

    <div id="debug-panel" hidden>
      <div id="debug-stats"></div>
      <label>
        現在の視点（initialView / arrival 用）
        <textarea id="debug-view" rows="2" readonly></textarea>
      </label>
      <label>
        クリックした位置（入口の position 用）
        <textarea id="debug-point" rows="1" readonly></textarea>
      </label>
      <button id="debug-align-btn" type="button">床合わせ（床を3点クリック）</button>
      <button id="debug-capture-btn" type="button" title="入口のサムネイル（thumbnail / autoThumbnail）用。アイコンは写りません">今の画面を画像で保存</button>
      <span id="debug-align-status"></span>
      <textarea id="debug-transform" rows="2" readonly hidden></textarea>
      <details id="debug-collision">
        <summary>当たり判定メッシュを重ねる（.collision.glb）</summary>
        <input id="debug-collision-file" type="file" accept=".glb" />
        <div id="debug-collision-options">
          <label>
            軸の補正
            <select id="debug-collision-axis">
              <option value="">なし</option>
              <option value="x">X 軸 180°</option>
              <option value="y">Y 軸 180°</option>
              <option value="z">Z 軸 180°</option>
            </select>
          </label>
          <label class="debug-check"><input id="debug-collision-wire" type="checkbox" /> ワイヤーフレーム</label>
          <label class="debug-check"><input id="debug-collision-visible" type="checkbox" checked /> 表示</label>
        </div>
        <span id="debug-collision-info"></span>
      </details>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
