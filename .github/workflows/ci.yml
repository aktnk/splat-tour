# Builds every pull request and main: `npm run build` runs tsc (strict, the
# repository's only static check, over src/, spike/ and viewer/) and the
# viewer build. Tour data is not in the repository, so nothing runs a tour.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
